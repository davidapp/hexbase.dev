<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/styles/main.css" />
<meta property="og:site_name" content="hexbase.dev" />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://hexbase.dev/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="hexbase.dev — inspect the bytes. Local-first developer tools for binary files, network packets, JSON, XML, timestamps and encodings." />
<meta name="twitter:card" content="summary_large_image" />
<script>
  ;(function () {
    try {
      var t = localStorage.getItem('hexbase-theme')
      if (t === 'light' || (!t && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        document.documentElement.dataset.theme = 'light'
      }
    } catch (e) {}
  })()
</script>
