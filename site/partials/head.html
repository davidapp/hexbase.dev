<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/styles/main.css" />
<meta property="og:site_name" content="hexbase.dev" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<!-- theme bootstrap: kept on ONE line with no surrounding whitespace so its CSP hash
     (src/worker/headers.ts, checked by test/headers.test.ts) is stable across platforms -->
<script>(function(){try{var t=localStorage.getItem('hexbase-theme');if(t==='light'||(!t&&matchMedia('(prefers-color-scheme: light)').matches))document.documentElement.dataset.theme='light'}catch(e){}})()</script>
