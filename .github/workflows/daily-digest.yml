name: Daily digest

# Posts yesterday's numbers (page views, shares, health, GitHub) to Slack.
# 01:00 UTC = 09:00 Asia/Shanghai. Secrets: SLACK_WEBHOOK_URL,
# CLOUDFLARE_API_TOKEN (needs Account Analytics: Read + D1: Read),
# CLOUDFLARE_ACCOUNT_ID.
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: node scripts/daily-digest.mjs
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
