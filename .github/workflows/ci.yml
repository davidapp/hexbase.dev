name: CI

# Pull-request checks. Needs no secrets, so it runs for forks too.
# Deployment is a separate workflow (deploy.yml) that only runs on main.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Worker env types
        run: npx wrangler types

      - run: npm test

      - run: npm run typecheck

      - run: npm run build
