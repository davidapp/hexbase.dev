name: CI

# Checks for pull requests and for every push to main. Needs no secrets,
# so it runs for forks too. Deployment is a separate workflow (deploy.yml)
# that only runs on main; running the checks here as well keeps the README
# badge tied to main rather than to whichever PR ran last.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Worker env types
        run: npx wrangler types

      - run: npm test

      - run: npm run typecheck

      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Page smoke tests
        run: npm run e2e
